# Install only after final review and issuance of the named certificate.
limit_req_zone $binary_remote_addr zone=holdsafe_api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=holdsafe_connections:10m;
server {
    listen 80;
    server_name holdsafe.xyz www.holdsafe.xyz;
    location /.well-known/acme-challenge/ { root /var/www/holdsafe-acme; }
    location / { return 301 https://holdsafe.xyz$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.holdsafe.xyz;
    ssl_certificate /etc/letsencrypt/live/holdsafe.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/holdsafe.xyz/privkey.pem;
    return 301 https://holdsafe.xyz$request_uri;
}
server {
    listen 443 ssl;
    server_name holdsafe.xyz;
    ssl_certificate /etc/letsencrypt/live/holdsafe.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/holdsafe.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 4k;
    limit_conn holdsafe_connections 10;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    location = / { return 302 /tmp/app; }
    location /tmp/app/api/ {
        limit_req zone=holdsafe_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 150s;
        proxy_buffering off;
    }
    location /tmp/app {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}
